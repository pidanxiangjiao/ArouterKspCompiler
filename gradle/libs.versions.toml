[versions]
# 插件版本
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"

# 库版本
commons-io = "2.16.1"
commons-codec = "1.16.1"
auto-common = "1.2.2"
javapoet = "1.13.0"
gson = "2.10.1"
antlr4 = "4.13.1"
juniversalchardet = "2.4.0"
jaxb-runtime = "2.3.2"
jakarta-xml-bind = "4.0.1"
junit = "5.10.1"
mockito = "5.8.0"
compile-testing = "0.21.0"
truth = "1.2.0"
guava = "33.0.0-jre"
jetifier-core = "1.0.0-beta10"

[libraries]

guava = { module = "com.google.guava:guava", version.ref = "guava" }
jetifier-core = { module = "com.android.tools.build.jetifier:jetifier-core", version.ref = "jetifier-core" }

# Classpath 依赖
apache_commons_io = { module = "commons-io:commons-io", version.ref = "commons-io" }
kotlin_gradle_plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Implementation 依赖
kotlin_stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
auto_common = { module = "com.google.auto:auto-common", version.ref = "auto-common" }
javapoet = { module = "com.squareup:javapoet", version.ref = "javapoet" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
apache_commons_codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
antlr4 = { module = "org.antlr:antlr4", version.ref = "antlr4" }
juniversalchardet = { module = "com.github.albfernandez:juniversalchardet", version.ref = "juniversalchardet" }
jaxb_runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb-runtime" }
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind" }
junit = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
mockito_core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
compile_testing = { module = "com.google.testing.compile:compile-testing", version.ref = "compile-testing" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }