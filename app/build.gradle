plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
//    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
}

// or--> apply plugin: 'kotlin-android'
// or--> apply plugin: 'com.google.devtools.ksp'
//ksp {
//    arg("AROUTER_MODULE_NAME", project.getName())
//}

android.sourceSets.all { it.java.srcDir("build/generated/ksp/${it.name}/kotlin/") }

kapt {
    showProcessorStats = true
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
    }
}

android {
    namespace 'cn.jailedbird.arouter.ksp'
    compileSdk 33

    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "cn.jailedbird.arouter.ksp"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        dataBinding = false
    }
}

dependencies {
    implementation 'com.alibaba:arouter-api:1.5.2'
//    ksp project(":arouter-compiler")
    implementation 'com.alibaba:fastjson:1.2.9'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation project(":baseLibrary")
    kapt project(":compiler")
    //kapt project(":arouter-kapt-compiler")
//    kapt files('libs/databinding-compiler.jar')
}